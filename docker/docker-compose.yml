
services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-attendance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-attendance_pass}
      POSTGRES_DB: ${DB_NAME:-smart_attendance}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-attendance_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smart_attendance_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@attendance.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - attendance_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  attendance_network:
    driver: bridge
